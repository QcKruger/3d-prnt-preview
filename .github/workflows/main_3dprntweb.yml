name: Build and deploy Node.js app to Azure Web App - 3dprntweb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production-3dprntweb
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          architecture: x64
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Security, build and regression checks
        run: npm run security:check
      - name: Package the Windows application
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $PWD 'azure-package'),
            (Join-Path $PWD 'azure-app.zip'),
            [System.IO.Compression.CompressionLevel]::Fastest,
            $false
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-app
          path: azure-app.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-app
      - name: Login to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA16D476E41B4ACF9F6CAB0B328EEC96 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4A34795839744288A8AA541CE840FC0B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_984904934A1741769C3084EC33F1A430 }}
      - name: Configure Windows runtime and keyless Cosmos connection
        shell: bash
        run: |
          hostname=$(az webapp show --resource-group 3D-PRNT --name 3dprntweb --query defaultHostName --output tsv --only-show-errors)
          [[ "$hostname" =~ ^[a-zA-Z0-9.-]+\.azurewebsites\.net$ ]]
          principal=$(az webapp identity assign --resource-group 3D-PRNT --name 3dprntweb --query principalId --output tsv --only-show-errors)
          [[ "$principal" =~ ^[a-fA-F0-9-]{36}$ ]]
          echo "Runtime system-assigned principal: $principal"
          echo "This principal needs Cosmos DB Built-in Data Reader on /dbs/3dprnt/colls/Items."
          az webapp config appsettings set --resource-group 3D-PRNT --name 3dprntweb --only-show-errors --output none --settings \
            WEBSITE_NODE_DEFAULT_VERSION=~24 WEBSITE_RUN_FROM_PACKAGE=1 SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            NODE_ENV=production HOST=0.0.0.0 "APP_ORIGIN=https://$hostname" \
            COSMOS_AUTH_MODE=managed-identity COSMOS_ENDPOINT=https://3dprntdb.documents.azure.com \
            COSMOS_DATABASE=3dprnt COSMOS_CONTAINER=Items
          az webapp update --resource-group 3D-PRNT --name 3dprntweb --https-only true --only-show-errors --output none
          echo "AZURE_APP_HOST=$hostname" >> "$GITHUB_ENV"
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: 3dprntweb
          slot-name: Production
          package: azure-app.zip
      - name: Verify the deployed sandbox API
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors --max-time 20 \
            "https://$AZURE_APP_HOST/api/payment/config" -o payment-config.json
          jq -e '.mode == "sandbox" and .notificationsEnabled == false' payment-config.json
